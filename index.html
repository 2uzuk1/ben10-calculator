<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora do Ben 10</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <img src="assets/ben-10-icon.png" alt="logo">
    </header>
    <audio autoplay loop>
        <source src="assets/ben10_op.mp3" type="audio/mp3">
    </audio>
    <section>
        <div class="calculator">
            <input type="text" id="display" readonly >
            <div class="box-button">
                <button class="btn btn-top" onclick="clearDisplay()">C</button>
                <button class="btn btn-top" onclick="backspace()">&lt;</button>
                <button class="btn btn-top" onclick="percent()">%</button>
                <button class="btn btn-operators" onclick="chooseOp('/')">/</button>
                <button class="btn btn-custom" onclick="digit('7')">7</button>
                <button class="btn btn-custom" onclick="digit('8')">8</button>
                <button class="btn btn-custom" onclick="digit('9')">9</button>
                <button class="btn btn-operators" onclick="chooseOp('*')">*</button>
                <button class="btn btn-custom" onclick="digit('4')">4</button>
                <button class="btn btn-custom" onclick="digit('5')">5</button>
                <button class="btn btn-custom" onclick="digit('6')">6</button>
                <button class="btn btn-operators" onclick="chooseOp('-')">-</button>
                <button class="btn btn-custom" onclick="digit('1')">1</button>
                <button class="btn btn-custom" onclick="digit('2')">2</button>
                <button class="btn btn-custom" onclick="digit('3')">3</button>
                <button class="btn btn-operators" onclick="chooseOp('+')">+</button>
                <button class="btn btn-custom" onclick="invertSign()">+/-</button>
                <button class="btn btn-custom" onclick="digit('0')">0</button>
                <button class="btn btn-custom" onclick="floatNumber()">.</button>
                <button class="btn btn-operators" onclick="equal()">=</button>
                <button id="btn-open" class="btn btn-operators" onclick="openParen()">(</button>
                <button id="btn-close" class="btn btn-operators" onclick="closeParen()">)</button>
            </div>
            <div class="sound">
                <button class="btn btn-custom btn-audio" onclick="toggleAudio()">▶</button>
            </div>
        </div>
    </section>
    <footer>&copy; Guilherme Suzuki</footer>
    <script src="js/script.js"></script>
</body>
</html>
